    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      function setHljsTheme(theme) {
        document.getElementById('hljs-theme').href = theme === 'dark'
          ? 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css'
          : 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css';
      }

      document.addEventListener('DOMContentLoaded', function () {
        var themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          setHljsTheme(next);
          mermaid.initialize({ startOnLoad: false, theme: next === 'dark' ? 'dark' : 'neutral' });
          document.querySelectorAll('#postBody .mermaid').forEach(function (el) {
            var src = el.getAttribute('data-mermaid-src');
            if (src) { el.removeAttribute('data-processed'); el.textContent = src; }
          });
          mermaid.run();
        });

        var swipeHint = document.getElementById('swipeHint');
        if (swipeHint) {
          swipeHint.addEventListener('click', function () {
            document.body.classList.add('sidebar-open');
          });
        }

        document.addEventListener('click', function (e) {
          if (document.body.classList.contains('sidebar-open')) {
            var sidebar = document.querySelector('.sidebar');
            var hint = document.getElementById('swipeHint');
            if (!sidebar.contains(e.target) && e.target !== hint) {
              document.body.classList.remove('sidebar-open');
            }
          }
        });

        var touchStartX = 0;
        document.addEventListener('touchstart', function (e) {
          touchStartX = e.touches[0].clientX;
        }, { passive: true });

        document.addEventListener('touchend', function (e) {
          var dx = e.changedTouches[0].clientX - touchStartX;
          if (dx > 60 && touchStartX < 40) {
            document.body.classList.add('sidebar-open');
          } else if (dx < -60) {
            document.body.classList.remove('sidebar-open');
          }
        }, { passive: true });

        function formatDate(dateStr) {
          return dateStr.replace(/-/g, '.');
        }

        function parseFrontmatter(raw) {
          var match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
          if (!match) return { meta: {}, body: raw };
          var meta = {};
          match[1].split('\n').forEach(function (line) {
            var kv = line.match(/^(\w+):\s*"?([^"]*)"?\s*$/);
            if (kv) meta[kv[1]] = kv[2];
          });
          return { meta: meta, body: match[2] };
        }

        var slug = new URLSearchParams(window.location.search).get('slug');
        if (!slug) {
          window.location.href = '/thoughts/';
          return;
        }

        fetch('/thoughts/' + encodeURIComponent(slug) + '/content.md')
          .then(function (r) {
            if (!r.ok) throw new Error('not found');
            return r.text();
          })
          .then(function (raw) {
            var parsed = parseFrontmatter(raw);
            var title = parsed.meta.title || slug;
            var date = parsed.meta.date ? formatDate(parsed.meta.date) : '';

            document.title = title + ' — Shivam Vyas';
            document.getElementById('postTitle').textContent = title;
            if (date) document.getElementById('postDate').textContent = date;

            marked.setOptions({ breaks: false, gfm: true });
            document.getElementById('postBody').innerHTML = marked.parse(parsed.body.trim());

            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'neutral' });
            document.querySelectorAll('#postBody pre code.language-mermaid').forEach(function (el) {
              var src = el.textContent;
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.setAttribute('data-mermaid-src', src);
              div.textContent = src;
              el.closest('pre').replaceWith(div);
            });
            mermaid.run();

            document.querySelectorAll('.post-body pre code').forEach(function (el) {
              hljs.highlightElement(el);
            });

            // Ensure headings have IDs
            document.querySelectorAll('#postBody h2, #postBody h3').forEach(function (h, i) {
              if (!h.id) {
                h.id = h.textContent.toLowerCase()
                  .replace(/[^a-z0-9\s-]/g, '')
                  .replace(/\s+/g, '-')
                  .replace(/-+/g, '-')
                  .trim() || ('heading-' + i);
              }
            });

            // Build TOC
            var tocList = document.getElementById('tocList');
            if (tocList) {
              document.querySelectorAll('#postBody h2, #postBody h3').forEach(function (h) {
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '#' + h.id;
                a.className = 'toc-link' + (h.tagName === 'H3' ? ' toc-link-h3' : '');
                a.textContent = h.textContent;
                a.addEventListener('click', function (e) {
                  e.preventDefault();
                  document.querySelectorAll('.toc-link').forEach(function (l) { l.classList.remove('active'); });
                  a.classList.add('active');
                  h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                li.appendChild(a);
                tocList.appendChild(li);
              });

              // Active section tracking
              var allTocLinks = document.querySelectorAll('.toc-link');
              var sectionObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                  if (entry.isIntersecting) {
                    allTocLinks.forEach(function (l) { l.classList.remove('active'); });
                    var match = tocList.querySelector('a[href="#' + entry.target.id + '"]');
                    if (match) match.classList.add('active');
                  }
                });
              }, { rootMargin: '-8% 0% -78% 0%' });

              document.querySelectorAll('#postBody h2, #postBody h3').forEach(function (h) {
                sectionObserver.observe(h);
              });
            }
          })
          .catch(function () {
            document.getElementById('postTitle').textContent = 'Post not found';
            document.getElementById('postBody').innerHTML =
              '<p class="projects-intro">This post could not be loaded. <a href="/thoughts/" class="inline-link">&larr; Back to Thoughts</a></p>';
          });
      });
    </script>
