<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Image — Shivam Vyas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111111; }
  </style>
</head>
<body>
  <div style="
    width: 1200px;
    height: 630px;
    background-color: #111111;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    overflow: hidden;
    position: relative;
  ">

    <!-- Very subtle radial vignette — top-right corner only -->
    <div style="
      position: absolute;
      top: -180px;
      right: -180px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(250,250,248,0.04) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
    "></div>

    <!-- Top: monogram -->
    <div>
      <span style="
        color: #555555;
        font-size: 20px;
        font-style: italic;
        letter-spacing: 3px;
      ">S.V.</span>
    </div>

    <!-- Middle: name + role -->
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <h1 style="
        color: #fafaf8;
        font-size: 86px;
        font-weight: 700;
        font-style: italic;
        line-height: 1;
        letter-spacing: -2px;
        margin: 0;
      ">Shivam Vyas</h1>
      <p style="
        color: #888888;
        font-size: 32px;
        font-weight: 400;
        font-style: italic;
        margin: 0;
        line-height: 1.4;
      ">Senior Software Engineer &mdash; Fintech &amp; Payments</p>
    </div>

    <!-- Bottom: domain + tags -->
    <div style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 32px;
    ">
      <span style="
        color: #888888;
        font-size: 22px;
        font-style: italic;
      ">shivamvyas.in</span>
      <div style="
        display: flex;
        gap: 18px;
        color: #444444;
        font-size: 18px;
        font-style: italic;
        align-items: center;
      ">
        <span>Java &middot; Spring Boot</span>
        <span style="color: #333333;">&middot;</span>
        <span>Banking Payments</span>
        <span style="color: #333333;">&middot;</span>
        <span>Mumbai, India</span>
      </div>
    </div>

  </div>
</body>
</html>
